<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gift</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
  <style>
    body { margin: 0; padding: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
    #btn {
        padding: 10px 20px; font-size: 16px; background: #000; color: #ff0055;
        border: 2px solid #ff0055; border-radius: 8px; cursor: pointer;
        z-index: 10; transition: 0.3s;
    }
    #btn:hover { background: #ff0055; color: #fff; }
  </style>
</head>
<body>

<button id="btn">Нажми, чтобы увидеть</button>

<script>
  let particles = [];
  let heartPoints = [];
  let started = false;

  function setup() {
    let canvas = createCanvas(windowWidth, windowHeight);
    canvas.position(0, 0);
    // Генерируем точки сердца один раз
    for (let a = 0; a < TWO_PI; a += 0.05) {
      let r = 10;
      let x = 16 * pow(sin(a), 3);
      let y = -(13 * cos(a) - 5 * cos(2 * a) - 2 * cos(3 * a) - cos(4 * a));
      heartPoints.push(createVector(x * r + width/2, y * r + height/2));
    }
    
    document.getElementById('btn').addEventListener('click', () => { 
        started = true; 
        document.getElementById('btn').style.display = 'none'; 
    });
  }

  function draw() {
    background(0, 20);
    if (started) {
      if (particles.length < 500) {
        particles.push(new Particle());
      }
      for (let p of particles) {
        p.update();
        p.show();
      }
    }
  }

  class Particle {
    constructor() {
      this.pos = createVector(random(width), random(height));
      this.target = random(heartPoints);
      this.vel = p5.Vector.sub(this.target, this.pos).mult(0.05);
    }
    update() { this.pos.add(this.vel); }
    show() {
      stroke(255, 0, 85);
      strokeWeight(2);
      point(this.pos.x, this.pos.y);
    }
  }
</script>
</body>
</html>
