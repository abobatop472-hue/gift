<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Неоновое сердце</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
  <style>
    body { 
        margin: 0; 
        background: #000; 
        overflow: hidden; 
        height: 100vh; 
        width: 100vw;
        display: flex; 
        justify-content: center; 
        align-items: center; 
        position: absolute;
        top: 0;
        left: 0;
    }
    #btn {
        padding: 20px 40px; 
        font-size: 24px; 
        background: transparent; 
        color: #ff00ff;
        border: 3px solid #ff00ff; 
        cursor: pointer; 
        border-radius: 15px;
        box-shadow: 0 0 20px #ff00ff; 
        transition: 0.3s;
        font-family: sans-serif; 
        font-weight: bold;
      position: relative !important;
      margin: auto !important;
    }
    #btn:hover { background: #ff00ff; color: #000; box-shadow: 0 0 40px #ff00ff; }
  </style>
</head>
<body>

<button id="btn">Нажми :3</button>

<script>
  let particles = [];
  let started = false;

  function setup() {
    createCanvas(windowWidth, windowHeight);
    document.getElementById('btn').addEventListener('click', () => { started = true; document.getElementById('btn').style.display = 'none'; });
  }

  function draw() {
    background(0, 50);
    if (started) {
      if (frameCount % 5 === 0) particles.push(new Particle());
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].show();
        if (particles[i].finished()) particles.splice(i, 1);
      }
    }
  }

  class Particle {
    constructor() {
      this.pos = createVector(width / 2, height / 2);
      this.vel = p5.Vector.random2D().mult(random(2, 5));
      this.alpha = 255;
    }
    update() { this.pos.add(this.vel); this.alpha -= 5; }
    show() {
      noStroke();
      fill(255, 0, 255, this.alpha);
      ellipse(this.pos.x, this.pos.y, 8);
    }
    finished() { return this.alpha < 0; }
  }
</script>
</body>
</html>
